<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>mruby-wasm-js — interactive demo</title>
    <style>
      :root {
        --bg: #fafafa;
        --panel: #fff;
        --border: #e5e5e5;
        --accent: #b94f3f;
        --text: #222;
        --muted: #888;
      }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 560px;
        margin: 0 auto;
        padding: 2em 1em;
        line-height: 1.55;
        color: var(--text);
        background: var(--bg);
      }
      h1 { margin: 0 0 0.3em 0; }
      .lede { color: var(--muted); margin-top: 0; }
      .clock {
        position: fixed;
        top: 1em; right: 1em;
        font: 600 0.95em ui-monospace, monospace;
        color: var(--muted);
        background: var(--panel);
        padding: 0.4em 0.8em;
        border-radius: 6px;
        border: 1px solid var(--border);
      }
      .panel {
        background: var(--panel);
        padding: 1em 1.2em;
        border-radius: 10px;
        margin: 1em 0;
        border: 1px solid var(--border);
      }
      .panel h2 { margin: 0 0 0.6em 0; font-size: 1.05em; }
      .row { display: flex; gap: 0.5em; align-items: center; }
      input {
        flex: 1;
        font-size: 1em;
        padding: 0.45em 0.7em;
        border-radius: 6px;
        border: 1px solid var(--border);
      }
      button {
        font-size: 1em;
        padding: 0.45em 1em;
        border-radius: 6px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: white;
        cursor: pointer;
      }
      button:hover { opacity: 0.9; }
      .out {
        margin-top: 0.8em;
        padding: 0.7em 0.9em;
        background: var(--bg);
        border-radius: 6px;
        font: 600 1em ui-monospace, monospace;
        min-height: 1.5em;
      }
      .num {
        font-family: ui-monospace, monospace;
        color: var(--accent);
        font-weight: 700;
      }
      #status { color: var(--muted); font-size: 0.85em; margin-top: 2em; }
    </style>
  </head>
  <body>
    <div class="clock" id="clock">--:--:--</div>

    <h1>mruby in your browser</h1>
    <p class="lede">
      Driven by a small Ruby script running on mruby compiled to
      WebAssembly. View source to read the script.
    </p>

    <div class="panel">
      <h2>Greeter</h2>
      <div class="row">
        <input id="name" type="text" placeholder="Your name" />
        <button id="greet">Greet</button>
      </div>
      <div class="out" id="message">(click the button)</div>
    </div>

    <div class="panel">
      <h2>Stats</h2>
      <p>
        Greeted <span class="num" id="count">0</span> times this session.
      </p>
    </div>

    <p id="status">booting…</p>

    <script type="module">
      import { createVM } from "../mrbgem/mruby-wasm-js/js/index.js";
      const status = document.getElementById("status");

      try {
        const vm = await createVM({ wasm: "../build/mruby-js.wasm" });

        vm.eval(`
# A small Ruby app running in your browser via mruby-wasm-js.
# Showcases: DOM access, event handlers (block as JS callback),
# setInterval, Promise#await, and Ruby-side state.

doc = JS.global[:document]

# --- Live clock ----------------------------------------------------
# JS.callback wraps a Ruby block as a JS function. setInterval fires
# it every 1000ms; we also fire it once immediately so the clock
# isn't empty for the first second.
clock = doc.getElementById("clock")
tick = JS.callback do
  clock[:textContent] = JS.global[:Date].new.toLocaleTimeString.to_s
end
tick.call(:call, nil)             # invoke once now (Function.prototype.call)
JS.global.setInterval(tick, 1000) # then every second

# --- Greeter -------------------------------------------------------
state = { count: 0 }
name_el = doc.getElementById("name")
btn     = doc.getElementById("greet")
msg     = doc.getElementById("message")
counter = doc.getElementById("count")

# Click handler. The block becomes a JS callback registered via
# addEventListener (see JS::Object#on in the gem).
btn.on(:click) do
  name = name_el[:value].to_s
  name = "world" if name.empty?

  state[:count] += 1
  counter[:textContent] = state[:count].to_s

  # Fake async delay (microtask yield) to demonstrate Fiber-based
  # await: the click handler suspends here and resumes once the
  # Promise settles, all without blocking the JS event loop.
  msg[:textContent] = "thinking…"
  JS.global[:Promise].call(:resolve).await
  msg[:textContent] = "Hello, #{name}!"
end

puts "ruby app booted"
`);

        status.textContent = "ready — try the greeter (and watch the clock)";
      } catch (err) {
        console.error(err);
        status.textContent = `boot failed: ${err.message}`;
      }
    </script>
  </body>
</html>
