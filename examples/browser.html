<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>mruby-wasm-runtime — bridge smoke</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2em; line-height: 1.6; }
      pre { background: #f5f5f5; padding: 1em; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>mruby-wasm-runtime — bridge smoke (boot only)</h1>
    <p>
      Boots <code>build/mruby-js.wasm</code> and runs the bridge smoke test
      (Float, JS.object, nil?, Promise.then, addEventListener+once).
    </p>
    <pre id="status">starting...</pre>

    <script type="text/ruby" id="ruby-source">
doc = JS.global[:document]
doc.title = 'Phase 2c OK'
n = JS.eval('1.5 + 2.25').to_f
puts "float = #{n}"
JS.global[:Promise].resolve(7).then { |v| puts "promise resolved: #{v.to_i}" }
    </script>

    <script type="module">
      import { createVM } from "../mrbgem/mruby-wasm-js/js/index.js";
      const status = document.getElementById("status");
      try {
        const vm = await createVM({ wasm: "../build/mruby-js.wasm" });
        vm.evalScript("#ruby-source");
        status.textContent = "boot OK — check console + tab title";
      } catch (err) {
        console.error(err);
        status.textContent = `boot failed: ${err.message}`;
      }
    </script>
  </body>
</html>
