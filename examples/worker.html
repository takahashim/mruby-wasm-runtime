<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>mruby-wasm-js — Worker</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 640px;
        margin: 2em auto;
        padding: 0 1em;
        color: #222;
      }
      h1 { font-size: 1.4em; margin: 0 0 0.2em; }
      p  { color: #666; margin: 0.2em 0 1.4em; line-height: 1.5; }
      button {
        padding: 0.4em 1em;
        font-size: 0.95em;
        background: #b94f3f;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-right: 0.6em;
      }
      button:hover { background: #a04030; }
      button:disabled { background: #ccc; cursor: not-allowed; }
      pre {
        margin-top: 1em;
        padding: 0.8em;
        background: #f4f4f4;
        border-radius: 4px;
        font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        min-height: 1.5em;
        white-space: pre-wrap;
      }
      .row { display: flex; align-items: center; gap: 1em; margin: 0.8em 0; }
      .spinner {
        width: 24px;
        height: 24px;
        border: 3px solid #eee;
        border-top-color: #b94f3f;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .status { color: #888; font-size: 0.85em; }
      .err { color: #b94f3f; }
      a { color: #b94f3f; }
    </style>
  </head>
  <body>
    <h1>mruby in a Web Worker</h1>
    <p>
      Heavy Ruby runs in a dedicated Worker, so the main thread stays
      responsive — the spinner below keeps spinning even while the VM
      churns. Compare with <a href="hello.html">hello.html</a>, where
      the VM runs on the main thread.
    </p>

    <div class="row">
      <button id="run" disabled>Count primes up to 100,000</button>
      <div class="spinner" title="Animates on the main thread — should never stutter"></div>
      <span id="status" class="status">Booting worker...</span>
    </div>

    <pre id="out"></pre>

    <script type="module">
      const out = document.getElementById("out");
      const status = document.getElementById("status");
      const runBtn = document.getElementById("run");

      const worker = new Worker(new URL("./worker-host.js", import.meta.url), { type: "module" });

      worker.addEventListener("message", (e) => {
        const msg = e.data;
        if (msg.type === "ready") {
          status.textContent = "Worker ready.";
          runBtn.disabled = false;
        } else if (msg.type === "error") {
          out.classList.add("err");
          const frames = (msg.backtrace ?? []).map((f) => "  " + f).join("\n");
          out.textContent = `${msg.rubyClass ?? msg.name}: ${msg.message}` +
            (frames ? "\n" + frames : "");
          status.textContent = "Worker errored.";
        } else if (msg.type === "result") {
          out.textContent = msg.text;
          status.textContent = `Done in ${msg.ms} ms (main thread stayed responsive)`;
          runBtn.disabled = false;
        }
      });

      // Boot the VM. The wasm URL is relative to this page; the Worker
      // resolves it via its own base URL, so we pass an absolute URL.
      const wasmUrl = new URL("../build/mruby-js.wasm", import.meta.url).href;
      worker.postMessage({ type: "init", wasm: wasmUrl });

      runBtn.addEventListener("click", () => {
        out.classList.remove("err");
        out.textContent = "";
        status.textContent = "Worker computing...";
        runBtn.disabled = true;
        const ruby = `
n = 100_000
t0 = JS.global[:Date].now.to_i
count = 0
(2..n).each do |i|
  prime = true
  d = 2
  while d * d <= i
    if i % d == 0
      prime = false
      break
    end
    d += 1
  end
  count += 1 if prime
end
ms = JS.global[:Date].now.to_i - t0
JS.global.postMessage(JS.object({ type: "result", text: "Found #{count} primes ≤ #{n}", ms: ms }))
`;
        worker.postMessage({ type: "run", source: ruby });
      });
    </script>
  </body>
</html>
