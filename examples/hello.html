<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>mruby-wasm-js — Hello</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 640px;
        margin: 2em auto;
        padding: 0 1em;
        color: #222;
      }
      h1 { font-size: 1.4em; margin: 0 0 0.2em; }
      p { color: #666; margin: 0.2em 0 1.4em; }
      textarea {
        width: 100%;
        height: 9em;
        font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        padding: 0.6em;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button {
        margin-top: 0.6em;
        padding: 0.4em 1em;
        font-size: 0.95em;
        background: #b94f3f;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover { background: #a04030; }
      button:disabled { background: #ccc; cursor: not-allowed; }
      pre {
        margin-top: 1em;
        padding: 0.8em;
        background: #f4f4f4;
        border-radius: 4px;
        font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 1.5em;
      }
      .status { color: #888; font-size: 0.85em; margin-left: 0.6em; }
      .err { color: #b94f3f; }
      a { color: #b94f3f; }
    </style>
  </head>
  <body>
    <h1>mruby on WebAssembly</h1>
    <p>
      Type Ruby in the box and press Run. The mruby VM lives in a wasm
      module loaded by
      <a href="https://www.npmjs.com/package/@takahashim/mruby-wasm-js">@takahashim/mruby-wasm-js</a>;
      it reaches back into this page through <code>JS.global</code>.
      <code>puts</code> output (stdout) shows up in your browser console.
    </p>

    <textarea id="src" spellcheck="false">
out = JS.global[:document].getElementById("out")
out[:textContent] = "Hello from mruby!\n" +
  "Page title: #{JS.global[:document][:title]}\n" +
  "1 + 2 = #{1 + 2}\n" +
  "Ruby: #{RUBY_VERSION} (#{RUBY_ENGINE})"
puts "(also wrote a line to the browser console)"
</textarea>
    <button id="run" disabled>Run</button>
    <span id="status" class="status">Loading mruby wasm...</span>

    <pre id="out"></pre>

    <script type="module">
      import { createVM } from "../mrbgem/mruby-wasm-js/js/index.js";

      const outEl = document.getElementById("out");
      const statusEl = document.getElementById("status");
      const runBtn = document.getElementById("run");
      const srcEl = document.getElementById("src");

      const vm = await createVM({ wasm: "../build/mruby-js.wasm" });

      statusEl.textContent = "Ready.";
      runBtn.disabled = false;

      runBtn.addEventListener("click", () => {
        outEl.classList.remove("err");
        const rc = vm.eval(srcEl.value);
        if (rc !== 0) {
          outEl.classList.add("err");
          outEl.textContent = "(eval returned non-zero — check console)";
        }
      });
    </script>
  </body>
</html>
